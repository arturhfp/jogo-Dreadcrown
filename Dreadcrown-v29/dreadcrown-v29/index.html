<!DOCTYPE html>
<!--
  Dreadcrown — ponto de entrada (modo desenvolvimento).
  Abra por um servidor local (npm run dev); para gerar o arquivo único, use npm run build (dist/).
  A ORDEM das tags importa: os scripts de interface observam o DOM criado pelo jogo.
  Versão com o jogo minificado original (React): index-legado.html.
  Modelo 3D "Orc Berserk Warrior (low poly)" por mezuna, CC-BY-4.0 (assets/modelos/orc.glb).
-->
<html lang="pt-BR">
<head>

<meta name="robots" content="index, follow"/>

<!-- Estilos: primeiro o do jogo, depois os ajustes, na ordem em que sobrescrevem uns aos outros -->
